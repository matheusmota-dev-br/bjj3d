# The full pipeline: unit tests with coverage, build, end-to-end and validation. It runs
# only when started by hand (Actions → ci → Run workflow, or `gh workflow run ci`), since
# WebGL without a GPU makes it take many minutes.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      # Unit tests of every package and the site, in Node and in headless Chromium,
      # failing below 100% coverage.
      - run: npm run data
      - run: npm test
      - run: npm run build
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      # The validation report is generated; fail if the committed copy is stale.
      - run: npm run validate && git diff --exit-code docs/validation.md
      # The catalog builds (it also builds the site, for its Pages level).
      - run: npm run build-storybook
