# The full pipeline: unit tests with coverage, build, end-to-end and validation. It runs on
# every pull request and on main; the viewer's tests draw off screen, so WebGL without a GPU
# no longer makes it take many minutes. It can still be started by hand (Actions → ci → Run
# workflow, or `gh workflow run ci`).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      # Unit tests of every package and the site, in Node and in headless Chromium,
      # failing below 100% coverage.
      - run: pnpm data
      - run: pnpm test
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      # The validation report is generated; fail if the committed copy is stale.
      - run: pnpm validate && git diff --exit-code docs/validation.md
      # The catalog builds (it also builds the site, for its Pages level).
      - run: pnpm build-storybook
