# Two jobs. `unit` runs on every pull request and on main: typecheck and the unit tests, in
# Node and in headless Chromium, failing below 100% coverage (a few minutes). `e2e` runs only
# when started by hand (Actions → ci → Run workflow, or `gh workflow run ci`): build,
# end-to-end, validation and the catalog. The runners have no GPU, so the real app draws at
# about 1 fps in software WebGL and the end-to-end suite takes many minutes.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm data
      - run: pnpm test

  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm data
      - run: pnpm build
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
      # The validation report is generated; fail if the committed copy is stale.
      - run: pnpm validate && git diff --exit-code docs/validation.md
      # The catalog builds (it also builds the site, for its Pages level).
      - run: pnpm build-storybook
