<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bjj-3d</title>
<meta name="description" content="Brazilian jiu-jitsu positions and transitions in 3D, with the load on the attacked joint.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Source+Sans+3:wght@400;600;700&display=swap">
</head>
<body>
<aside id="panel">
  <div class="top">
    <div class="top-row">
      <a class="name" href="#"><img src="favicon.svg" alt="" width="26" height="26">bjj-3d</a>
      <button id="panel-close" class="chip-btn round" aria-label="✕">✕</button>
    </div>
    <input id="search" type="search" autocomplete="off" spellcheck="false">
  </div>
  <div id="panel-body"></div>
  <div class="foot">
    <p id="about" class="muted"></p>
    <div class="prefs"><select id="lang"></select><button id="theme" class="chip-btn round"></button></div>
  </div>
</aside>
<main id="stage">
  <canvas id="view"></canvas>

  <div class="top-left">
    <button id="menu" class="float-btn"></button>
    <div id="title-card" class="glass"><span id="kind" class="kind"></span><h1 id="title"></h1><p id="ends"></p></div>
  </div>

  <div class="top-right">
    <div class="seg glass" id="camchip"></div>
    <button id="settings-btn" class="float-btn" aria-expanded="false"></button>
    <div id="settings" class="popover settings" hidden>
      <div class="row"><span class="label" id="look-label"></span><div class="seg" id="look"></div></div>
      <div class="row"><span class="label" id="place-label"></span><div class="seg" id="place"></div></div>
      <div class="row"><span class="label" id="camera-label"></span><div class="seg" id="camera"></div></div>
      <div class="row"><span class="label" id="speed-label"></span><div class="seg" id="speed"></div></div>
      <div id="options"></div>
      <div class="row actions"><button id="fighters-btn" class="chip-btn"></button><button id="help-btn" class="chip-btn round" aria-label="?">?</button></div>
    </div>
  </div>

  <div id="vignette"></div>
  <div id="oss" hidden><span class="ring"></span><span class="ring"></span><span class="word">Oss!</span></div>
  <div id="attention"><span id="angle"></span></div>

  <aside id="customizer" class="customizer" hidden>
    <div class="cz-head"><h2 id="cz-title"></h2><button id="cz-done" class="chip-btn"></button></div>
    <div class="tabs" id="cz-tabs"></div>
    <div id="cz-body" class="cz-body"></div>
  </aside>

  <div id="help" class="help" hidden>
    <h2 id="help-title"></h2>
    <ol id="help-steps"></ol>
    <button id="help-ok" class="primary"></button>
  </div>

  <div class="player">
    <p id="risk"></p>
    <p id="caption"></p>
    <div class="strip glass">
      <button id="play" class="icon-btn play">▶</button>
      <div id="thumbs"></div>
      <a id="next-chip" class="next-chip" hidden></a>
    </div>
  </div>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
