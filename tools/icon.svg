<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- two mannequin limbs locked across each other, amber and blue, the joint lit where they meet -->
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#d9962a"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#2f7fd0"/></linearGradient>
    <radialGradient id="joint"><stop offset="0" stop-color="#fff"/><stop offset=".3" stop-color="#ff6b85"/><stop offset=".62" stop-color="#ff3355"/><stop offset="1" stop-color="#ff3355" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="128" height="128" rx="28" fill="#0e1726"/>
  <g filter="url(#shadow)">
    <!-- blue limb, lower left to upper right -->
    <g transform="rotate(-42 64 64)">
      <rect x="20" y="53" width="88" height="22" rx="11" fill="url(#blue)"/>
      <circle cx="20" cy="64" r="14" fill="url(#blue)"/>
      <circle cx="108" cy="64" r="14" fill="url(#blue)"/>
    </g>
    <!-- amber limb, upper left to lower right, on top -->
    <g transform="rotate(42 64 64)">
      <rect x="20" y="53" width="88" height="22" rx="11" fill="url(#amber)"/>
      <circle cx="20" cy="64" r="14" fill="url(#amber)"/>
      <circle cx="108" cy="64" r="14" fill="url(#amber)"/>
    </g>
  </g>
  <circle cx="64" cy="64" r="26" fill="url(#joint)"/>
</svg>
